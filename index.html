<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calories">
<meta name="theme-color" content="#2f9e44">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Calorie Tracker</title>
<style>
:root{--bg:#f4f6f4;--card:#fff;--fg:#1c2420;--mut:#6b756f;--line:#e2e7e3;--acc:#2f9e44;--acc2:#237a34;--soft:#e7f5ea;--warn:#e8590c;--bad:#e03131;--p:#4c6ef5;--c:#f59f00;--f:#d6336c;--sh:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#101412;--card:#1a201c;--fg:#e7ece8;--mut:#98a29c;--line:#2a322d;--acc:#51cf66;--acc2:#51cf66;--soft:#1d3223;--sh:none;--p:#748ffc;--c:#fcc419;--f:#f06595}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:0 14px calc(150px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 0 10px;padding-top:calc(12px + env(safe-area-inset-top))}
html.standalone .top{padding-top:calc(24px + env(safe-area-inset-top))}
.top h1{font-size:20px;margin:0;flex:1;text-align:center}
.top h1.l{text-align:left}
.ib{border:0;background:var(--card);box-shadow:var(--sh);width:38px;height:38px;border-radius:12px;font-size:20px;cursor:pointer;display:grid;place-items:center;flex:none}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:14px;margin:0 0 12px}
.card h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;font-weight:600;color:var(--mut);font-size:14px}
.mut{color:var(--mut)}.sm{font-size:13px}.b{font-weight:700}.c{text-align:center}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--acc);color:#fff;font-weight:650;cursor:pointer;display:inline-block}
.btn.w{width:100%}.btn.g{background:var(--soft);color:var(--acc2)}.btn.d{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.lnk{background:none;border:0;color:var(--acc2);font-weight:600;cursor:pointer;padding:6px 0}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:none}
.stats{flex:1;display:grid;gap:6px}
.stat{display:flex;justify-content:space-between;font-size:14px}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mac div{font-size:12px;color:var(--mut)}
.mac b{display:block;color:var(--fg);font-size:14px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:3px}
.ent{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.ent .n{flex:1;min-width:0}
.ent .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .k{font-weight:650;white-space:nowrap}
.addrow{display:flex;gap:14px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px;flex-wrap:wrap}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(47,158,68,.45);cursor:pointer;z-index:6}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;max-width:140px;text-align:center;padding:8px 0 7px;text-decoration:none;color:var(--mut);font-size:12px}
nav a span{display:flex;align-items:center;justify-content:center;height:28px;font-size:22px;line-height:1;margin-bottom:2px;filter:grayscale(1);opacity:.7}
nav a.on{color:var(--acc2);font-weight:700}nav a.on span{filter:none;opacity:1}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;padding:12px 14px calc(14px + env(safe-area-inset-bottom));animation:up .18s ease-out}
.sheet.tall{height:92vh;height:92dvh}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sh-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sh-body{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:650}
.scroll-x{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;outline:none}
input.t:focus,textarea.t:focus,select.t:focus{border-color:var(--acc)}
.search{font-size:17px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:12px;margin-bottom:6px;cursor:pointer;box-shadow:var(--sh)}
.row .n{flex:1;min-width:0}
.row .n b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plus{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--acc2);font-size:22px;font-weight:700;cursor:pointer;line-height:1}
.plus.done{background:var(--acc);color:#fff}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700;margin:14px 2px 6px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;cursor:pointer;flex:none}
.step input{text-align:center;font-size:20px;font-weight:700;flex:1;min-width:0}
.big{font-size:40px;font-weight:800;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
label.f{display:block;font-size:13px;color:var(--mut);font-weight:600;margin:10px 0 4px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;border-radius:9px;padding:8px;background:none;cursor:pointer;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--sh)}
.ing{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.ing .n{flex:1;min-width:0}
.ing.bad .n b{color:var(--bad)}
.x{border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer;padding:4px 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:40;font-size:14px;font-weight:600;animation:up .15s;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--acc2);vertical-align:2px}
.warnbox{background:rgba(232,89,12,.1);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
svg text{fill:var(--mut);font-size:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.kv b{text-align:right}
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.extile{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 4px 9px;font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.2;text-align:center;min-height:74px;justify-content:center}
.extile span{font-size:24px}
.extile:active{background:var(--soft)}
.ent .k.plus-k{color:var(--acc2)}
.fabs{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(78px + env(safe-area-inset-bottom));z-index:6;display:flex;flex-direction:column;align-items:center;gap:10px}
.fabs .fab{position:static}
.fab2{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:22px;cursor:pointer}
</style>
</head>

const STOP=new Set('a an and of the with for to or in on fresh chopped diced sliced minced finely roughly thinly peeled grated crushed shredded large small medium taste optional about packed heaped level plus extra serve serving cut into piece pieces drained rinsed halved quartered softened melted beaten lightly room temperature trimmed boneless skinless at x approx good quality ground'.split(' '));

function sing(w){if(w.length>4&&w.endsWith('ies'))return w.slice(0,-3)+'y';if(w.length>4&&w.endsWith('oes'))return w.slice(0,-2);if(w.length>3&&w.endsWith('s')&&!w.endsWith('ss'))return w.slice(0,-1);return w}
const toks=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(Boolean).map(sing);
const ftCache=new Map();
function ftoks(f){let v=ftCache.get(f.name);if(!v){const main=toks(f.name.replace(/\(.*?\)/g,' ')),par=toks((f.name.match(/\((.*?)\)/g)||[]).join(' '));v={main,par};ftCache.set(f.name,v)}return v}
function score(f,q,opt={}){const t=ftoks(f);let s=0,hit=new Set();
  for(const w of q){let best=0,hw=null;
    for(const m of t.main){const v=m===w?3:(w.length>=2&&m.startsWith(w))?2.2:(m.length>=4&&w.startsWith(m))?1.6:0;if(v>best){best=v;hw=m}}
    for(const m of t.par){const v=m===w?1.5:(w.length>=3&&m.startsWith(w))?1:0;if(v>best){best=v;hw=null}}
    s+=best;if(hw)hit.add(hw)}

  const mq=q.includes('mcdonald')||toks(text).some(w=>/^mc[a-z]/.test(w)&&w!=='mcdonald'),res=[];allFoods(!opt.noRecipes).forEach((f,i)=>{const mc=f.cat.startsWith('McDonald');if(mc&&opt.raw&&!mq)return;const s=score(f,q,opt);
    if(s>=(opt.min||1.5))res.push([s+(mc?(mq?1:(opt.recent&&S.recent[f.ref]?0:-1.5)):0)-(/limited time/.test(f.name)?0.6:0),f,i])})

/* ---------- ingredient parser ---------- */
const UFR={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125};
const UNIT=/^(kg|kilograms?|g|grams?|gm|gms|ml|millilitres?|milliliters?|l|litres?|liters?|cups?|c|tbsp|tbs|tbl|tablespoons?|tsp|teaspoons?|cloves?|slices?|cans?|tins?|pinch(?:es)?|handfuls?|bunch(?:es)?|pieces?|rashers?|fillets?|stalks?|sticks?|sprigs?|heads?|medium|large|small|whole|packets?|pkts?|sachets?|eggs?|oz|lb|lbs)\b\.?/i;
const UCAN={kilogram:'kg',kilograms:'kg',gram:'g',grams:'g',gm:'g',gms:'g',millilitre:'ml',millilitres:'ml',milliliter:'ml',milliliters:'ml',litre:'l',litres:'l',liter:'l',liters:'l',c:'cup',cups:'cup',tbs:'tbsp',tbl:'tbsp',tablespoon:'tbsp',tablespoons:'tbsp',teaspoon:'tsp',teaspoons:'tsp',tin:'can',tins:'can',pkt:'packet',pkts:'packet',lbs:'lb',pinches:'pinch',bunches:'bunch'};
const GEN={cup:250,tbsp:15,tsp:5,pinch:0.5,can:400,handful:30,bunch:60,slice:30,clove:4,rasher:30,packet:250,stalk:40,stick:40,sprig:1,head:500,sachet:10,oz:28.35,lb:453.6,fillet:150,piece:50};
const MASS=['g','ml','kg','l'];
function parseLine(line){
  let s=line.trim().replace(/^[\-\*•·▢□☐◦–]+\s*/,'').replace(/(\d)?\s*([½¼¾⅓⅔⅛])/g,(m,a,b)=>' '+((+a||0)+UFR[b])+' ').replace(/\s+/g,' ').trim();
  let q=null,u=null,m;
  if(m=s.match(/^(\d+)\s*x\s*(\d*\.?\d+)\s*(g|ml|kg)\b\s*/i)){q=+m[1]*+m[2];u=m[3].toLowerCase();s=s.slice(m[0].length)}
  else if(m=s.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)(?:\s*(?:-|–|to)\s*(\d*\.?\d+))?\s*/)){
    const v=x=>x.split(/\s+/).reduce((a,p)=>a+(p.includes('/')?(+p.split('/')[0]/+p.split('/')[1]):+p),0);
    q=v(m[1]);if(m[2])q=(q+ +m[2])/2;s=s.slice(m[0].length);
    const um=s.match(UNIT);if(um){u=um[1].toLowerCase();u=UCAN[u]||u.replace(/(es|s)$/,'');if(u==='egg')u=null;else s=s.slice(um[0].length).trim()}
    const pm=s.match(/^\(?(\d*\.?\d+)\s*(g|ml)\)?\s+/i);
    if(pm&&(!u||!MASS.includes(u))){q=q*+pm[1];u=pm[2].toLowerCase();s=s.slice(pm[0].length);const u2=s.match(/^(cans?|tins?|packets?|pkts?|jars?)\b\s*/i);if(u2)s=s.slice(u2[0].length)}
  }
  else if(m=s.match(/^(?:a\s+|an\s+)?(handful|pinch|splash|dash|bunch|knob)(?:es|s)?\b\s*(?:of\s+)?/i)){q=1;u={splash:"tbsp",dash:"tsp",knob:"tbsp"}[m[1].toLowerCase()]||m[1].toLowerCase();s=s.slice(m[0].length)}
  s=s.replace(/^\s*of\s+/i,'');
  const name=s.replace(/\(.*?\)/g,' ').split(/,|;| - | to serve| for serving| or /i)[0].trim();
  return{q,u,name:name||s,src:line.trim()}}
function gramsFor(f,q,u){
  if(q==null)q=1;

  if(u==='g'||u==='ml')return{g:q,svi:-1,q};if(u==='kg'||u==='l')return{g:q*1000,svi:-1,q:q*1000};

/* ---------- plan / goals ---------- */
const weightDates=()=>Object.keys(S.weights).sort();
function curWeight(){const d=weightDates();return d.length?S.weights[d[d.length-1]]:null}
function plan(){const p=S.profile,w=curWeight();if(!w||!p.age||!p.height)return null;
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==='m'?5:-161),tdee=bmr*p.activity;
  const dir=p.goal?(p.goal<w-0.05?1:p.goal>w+0.05?-1:0):0,adj=dir*p.rate*7700/7;
  let t=tdee-adj;const floor=p.sex==='m'?1500:1200,floored=dir>0&&t<floor;if(dir>0)t=Math.max(t,floor);
  const auto=Math.round(t/10)*10;return{bmr,tdee,adj,auto,floored,dir,target:p.override||auto}}
const target=()=>(plan()||{}).target||S.profile.override||2000;
function dayTot(k){const t={k:0,p:0,c:0,f:0};for(const e of S.log[k]||[])for(const m of'kpcf')t[m]+=e[m]||0;return t}

function renderRecipe(id){if(!RE||RE._for!==id){const r=id&&id!=='new'?S.recipes.find(r=>r.id===id):null;RE=r?JSON.parse(JSON.stringify(r)):{id:null,name:'',servings:4,items:[]};RE._for=id}

   <div class="sm mut" style="margin-top:8px">Whole recipe: ${fmt(t.k)} kcal · ${fmt(t.g)} g · ${fmt(t.g/sv)} g per serving</div></div>
  <div class="card"><h2>Ingredients<span class="r">${RE.items.length}</span></h2>`;

    h+=f?`<div class="ing" onclick="editIng(${i})"><div class="n"><b>${esc(f.name)}</b><div class="mut sm">${esc(it.sv?fq(Math.round(it.q*100)/100)+' '+it.sv+' · '+Math.round(it.g)+unitOf(f):Math.round(it.g)+' '+(unitOf(f)||'g'))}${it.src?` · “${esc(it.src)}”`:''}</div></div><div class="b">${fmt(f.k*it.g/100)}</div><button class="x" aria-label="Remove" onclick="event.stopPropagation();RE.items.splice(${i},1);renderRecipe(RE._for)">✕</button></div>`
     :`<div class="ing bad" onclick="editIng(${i})"><div class="n"><b>Tap to match</b><div class="mut sm">“${esc(it.src)}”</div></div><button class="x" aria-label="Remove" onclick="event.stopPropagation();RE.items.splice(${i},1);renderRecipe(RE._for)">✕</button></div>`});
  if(bad)h+=`<div class="warnbox">${bad} line${bad>1?'s':''} couldn't be matched automatically — tap to choose a food, or ✕ to skip.</div>`;
  if(RE.items.length)h+=`<div class="mut sm" style="margin-top:8px">Check the matches — tap any ingredient to change the food or amount.</div>`;
  h+=`<div class="addrow"><button class="lnk" onclick="addIng()">＋ Add ingredient</button></div></div>
  <div class="card"><h2>📋 Paste or upload ingredients</h2><div class="mut sm" style="margin-bottom:8px">One per line, e.g. “500g chicken thigh”, “2 tbsp olive oil”, “1 cup rice”. You can paste a whole recipe from a website — the title, “Serves 4” and method steps are handled.</div>
   <textarea class="t" id="rpaste" rows="5" placeholder="500g beef mince&#10;1 onion, diced&#10;2 cloves garlic&#10;400g can tomatoes&#10;250g pasta"></textarea>
   <div style="display:flex;gap:8px;margin-top:8px;align-items:center"><button class="btn" onclick="importText($('#rpaste').value)">Add lines</button><label class="btn g" style="cursor:pointer">Upload file<input type="file" accept=".txt,.md,.csv,text/*" style="display:none" onchange="readFile(this)"></label></div></div>

  ${RE.id?`<div style="display:flex;gap:8px;margin-top:8px"><button class="btn g" style="flex:1" onclick="saveRecipe(true)">Save & log a serving</button><button class="btn d" style="flex:1" onclick="delRecipe()">Delete</button></div>`:''}`;
  const y=scrollY;$('#app').innerHTML=h;scrollTo(0,y)}
function readFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importText(r.result);r.readAsText(f)}
function importText(txt){if(!txt||!txt.trim())return toast('Paste some ingredients first');RE.name=($('#rn')||{}).value??RE.name;
  const lines=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);let inIng=!/^\s*ingredients?\s*:?\s*$/im.test(txt),added=0,title=null;
  for(const l of lines){
    if(/^(method|instructions|directions|steps|preparation|to make|notes?|nutrition)\b:?/i.test(l)){if(inIng&&added)break;continue}
    if(/^ingredients?\s*:?\s*$/i.test(l)){inIng=true;continue}
    const sm=l.match(/^(?:serves|servings|makes|yield|portions)\s*:?\s*(\d+)/i)||l.match(/^(\d+)\s+(?:servings|serves|portions)\b/i);if(sm){RE.servings=+sm[1];continue}
    if(!inIng){if(!title&&!/\d/.test(l)&&l.length<70)title=l;continue}
    if(!/[a-z]/i.test(l)||l.endsWith(':'))continue;
    if(/^(step\s*)?\d+[\.\):]\s+\w+.{40,}/i.test(l))continue;
    RE.items.push(matchIngredient(l));added++}
  if(title&&!RE.name)RE.name=title;
  renderRecipe(RE._for);toast(`Added ${added} ingredient${added===1?'':'s'}`)}
function addIng(){RE.name=$('#rn').value;openAdd(null,{mode:'pick',cb:r=>{RE.items.push(r);renderRecipe(RE._for)}})}
function editIng(i){RE.name=$('#rn').value;const it=RE.items[i],f=getFood(it.ref);const cb=r=>{RE.items[i]={...r,src:it.src};renderRecipe(RE._for)};
  const q=it.src?parseLine(it.src).name:'';if(!f)return openAdd(null,{mode:'pick',q,cb});
  const svi=it.sv?f.sv.findIndex(s=>s[0]===it.sv):-1;openAdd(null,{mode:'pick',cb,q,sel:f,amt:{svi,q:svi<0?Math.round(it.g):it.q}})}
function pickDone(){const f=SH.sel,g=amtG(f,SH.svi,SH.qty);if(!(g>0))return toast('Enter an amount');const r={ref:f.ref,g:r1(g),sv:SH.svi<0?null:f.sv[SH.svi][0],q:SH.svi<0?g:SH.qty};const cb=SH.cb;closeSheet();cb(r)}
function saveRecipe(log){RE.name=($('#rn').value||'').trim()||'Untitled recipe';RE.items=RE.items.filter(i=>i.ref);if(!RE.id)RE.id=uid();
  const{_for,...r}=RE;const i=S.recipes.findIndex(x=>x.id===r.id);if(i>=0)S.recipes[i]=r;else S.recipes.unshift(r);save();RE=null;toast('Recipe saved');
  if(log){go('#/today');setTimeout(()=>openAdd(null,{sel:getFood('rc:'+r.id)}),80)}else{FTAB='rec';go('#/foods')}}
function delRecipe(){if(!confirm('Delete this recipe? Past log entries keep their calories.'))return;S.recipes=S.recipes.filter(r=>r.id!==RE.id);delete S.recent['rc:'+RE.id];save();FTAB='rec';go('#/foods')}

/* ---------- PROGRESS ---------- */
let WR=90;
function weightChart(){const d=weightDates();if(!d.length)return`<div class="mut sm c" style="padding:24px 0">Log your weight to see your progress chart.</div>`;
  const end=+pd(dk()),start=WR?end-WR*864e5:+pd(d[0]);let pts=d.filter(x=>+pd(x)>=start).map(x=>[+pd(x),S.weights[x]]);if(!pts.length)pts=[[+pd(d[d.length-1]),S.weights[d[d.length-1]]]];
  const x0=Math.min(start,pts[0][0]),x1=Math.max(end,pts[pts.length-1][0]),W=340,H=170,L=30,B=20,T=10,g=S.profile.goal;
  const ys=pts.map(p=>p[1]);if(g)ys.push(g);const y0=Math.floor(Math.min(...ys)-1),y1=Math.ceil(Math.max(...ys)+1);
  const X=t=>L+(W-L-6)*((t-x0)/Math.max(1,x1-x0)),Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  const sm=pts.map(p=>{const w=pts.filter(q=>q[0]<=p[0]&&p[0]-q[0]<7*864e5);return[p[0],w.reduce((a,q)=>a+q[1],0)/w.length]});
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;const step=Math.max(1,Math.ceil((y1-y0)/4));
  for(let v=y0;v<=y1;v+=step)s+=`<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end">${v}</text>`;
  if(g)s+=`<line x1="${L}" x2="${W}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--acc)" stroke-dasharray="5 4"/><text x="${W-2}" y="${Y(g)-4}" text-anchor="end" style="fill:var(--acc)">goal ${g}</text>`;
  [x0,(x0+x1)/2,x1].forEach((t,i)=>s+=`<text x="${X(t)}" y="${H-5}" text-anchor="${['start','middle','end'][i]}">${new Date(t).toLocaleDateString('en-AU',{day:'numeric',month:'short'})}</text>`);
  if(sm.length>1)s+=`<polyline fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" points="${sm.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`;
  s+=pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="var(--card)" stroke="var(--acc2)" stroke-width="1.5"/>`).join('');return s+'</svg>'}
function calChart(){const tg=target(),days=[...Array(14)].map((_,i)=>addDays(dk(),i-13)),vals=days.map(k=>dayTot(k).k),mx=Math.max(tg*1.3,...vals),W=340,H=140,B=18,bw=W/14;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  days.forEach((k,i)=>{const v=vals[i],h=(H-B-6)*v/mx;if(v)s+=`<rect x="${i*bw+3}" y="${H-B-h}" width="${bw-6}" height="${h}" rx="3" fill="${v>budget(k)*1.05?'var(--warn)':'var(--acc)'}" opacity="${k===dk()?1:.75}" onclick="go('#/today/${k}')" style="cursor:pointer"/>`;
    s+=`<text x="${i*bw+bw/2}" y="${H-5}" text-anchor="middle">${'SMTWTFS'[pd(k).getDay()]}</text>`});
  const ty=H-B-(H-B-6)*tg/mx;s+=`<line x1="0" x2="${W}" y1="${ty}" y2="${ty}" stroke="var(--fg)" stroke-dasharray="4 4" opacity=".5"/>`;return s+'</svg>'}
function renderProgress(){const p=S.profile,d=weightDates(),cur=curWeight(),st=d.length?S.weights[d[0]]:null,tr=trend(),pl=plan();
  let h=`<div class="top"><h1 class="l">Progress</h1></div>`;
  if(p.goal&&cur){const tot=st-p.goal,done=st-cur,pct=tot>0?Math.max(0,Math.min(100,done/tot*100)):0,left=cur-p.goal;
    const eta=r=>r>0&&left>0?new Date(Date.now()+left/r*7*864e5).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}):null;
    h+=`<div class="card"><h2>🎯 Goal: ${p.goal} kg</h2><div style="display:flex;justify-content:space-between;align-items:flex-end"><div><div class="big">${left>0?r1(left):'🎉'}</div><div class="mut sm">${left>0?'kg to go':'Goal reached!'}</div></div><div style="text-align:right"><b>${r1(Math.abs(done))} kg</b> <span class="mut sm">${done>=0?'lost':'gained'} since ${nice(d[0])}</span></div></div>
     <div class="bar" style="height:10px;border-radius:5px;margin-top:12px"><i style="width:${pct}%;background:var(--acc)"></i></div><div class="mut sm" style="display:flex;justify-content:space-between;margin-top:4px"><span>${st} kg</span><span>${Math.round(pct)}%</span><span>${p.goal} kg</span></div>
     ${left>0?`<div class="kv" style="margin-top:8px"><span class="mut">At your plan (${p.rate} kg/wk)</span><b>${eta(p.rate)||'—'}</b></div>
     <div class="kv"><span class="mut">At your actual trend</span><b>${tr==null?'<span class="mut sm">needs 1+ week of weigh-ins</span>':tr<0?eta(-tr)+` <span class="mut sm">(${r1(-tr)} kg/wk)</span>`:`<span class="mut sm">not losing yet (${tr>0?'+':''}${r1(tr)} kg/wk)</span>`}</b></div>`:''}</div>`}
  else h+=`<div class="card" style="background:var(--soft)"><h2>🎯 Set a weight goal</h2><div class="sm">Add your goal weight to track progress and get an estimated finish date.</div><button class="btn" style="margin-top:10px" onclick="go('#/goal')">Set goal</button></div>`;
  h+=`<div class="card"><h2>⚖️ Weight<span class="r">${cur?cur+' kg':''}</span></h2><div class="chips" style="margin-bottom:8px">${[[30,'1M'],[90,'3M'],[180,'6M'],[0,'All']].map(([v,l])=>`<button class="chip ${WR===v?'on':''}" onclick="WR=${v};renderProgress()">${l}</button>`).join('')}</div>${weightChart()}
    <div style="display:flex;gap:8px;margin-top:10px"><input class="t" id="wd" type="date" value="${dk()}" style="flex:1.3;min-width:0"><input class="t" id="wv" type="number" step="0.1" inputmode="decimal" placeholder="kg" style="flex:1;min-width:0"><button class="btn" onclick="logWeight($('#wd').value,$('#wv').value)">Log</button></div>
    ${d.length?`<details style="margin-top:10px"><summary class="mut sm" style="cursor:pointer">All weigh-ins (${d.length})</summary>${d.slice().reverse().map((k,i,a)=>{const prev=a[i+1]?S.weights[a[i+1]]:null,df=prev!=null?r1(S.weights[k]-prev):null;return`<div class="kv"><span>${nice(k,1)}</span><span><b>${S.weights[k]} kg</b> <span class="mut sm" style="display:inline-block;width:46px;text-align:right">${df==null?'':(df>0?'+':'')+df}</span><button class="x" aria-label="Delete" onclick="delete S.weights['${k}'];save();renderProgress()">✕</button></span></div>`}).join('')}</details>`:''}</div>`;
  const wk=[...Array(7)].map((_,i)=>addDays(dk(),-i)).filter(k=>(S.log[k]||[]).length),avg=wk.length?wk.reduce((a,k)=>a+dayTot(k).k,0)/wk.length:0;
  const d7=[...Array(7)].map((_,i)=>addDays(dk(),-i)),exw=d7.reduce((a,k)=>a+dayExBurn(k),0),exn=d7.reduce((a,k)=>a+dayExList(k).length,0),exAvg=wk.length?wk.reduce((a,k)=>a+dayExBurn(k),0)/wk.length:0;
  h+=`<div class="card"><h2>🔥 Calories, last 14 days</h2>${calChart()}<div class="kv"><span class="mut">7-day average (days logged)</span><b>${wk.length?fmt(avg)+' kcal':'—'}</b></div><div class="kv"><span class="mut">Daily target</span><b>${fmt(target())} kcal</b></div><div class="kv"><span class="mut">Days logged, last 7</span><b>${wk.length} / 7</b></div>
   <div class="kv"><span class="mut">Exercise, last 7 days</span><b>${exn?fmt(exw)+' kcal · '+exn+' session'+(exn>1?'s':''):'—'}</b></div>
   ${pl&&wk.length?(()=>{const net=pl.tdee+exAvg-avg;return`<div class="kv"><span class="mut">Est. ${net>0?'deficit':'surplus'} vs maintenance${exAvg?' (incl. exercise)':''}</span><b>${fmt(Math.abs(net))} kcal/day ≈ ${r1(Math.abs(net)*7/7700)} kg/wk</b></div>`})():''}</div>`;
  $('#app').innerHTML=h}

  <div class="card"><div class="seg" style="margin:0 0 4px">${[['m','Male'],['f','Female']].map(([k,n])=>`<button class="${p.sex===k?'on':''}" onclick="gSet('sex','${k}')">${n}</button>`).join('')}</div>

  <div id="gres"></div>`;drawGoal()}
function gSet(k,v){S.profile[k]=v;save();if(k==='sex')renderGoal();else drawGoal()}
function drawGoal(){const pl=plan(),p=S.profile;let h='';

  else{const cw=curWeight();h=`<div class="card" style="background:var(--soft)"><div class="mut sm">Your daily calorie target</div><div class="big" style="margin:4px 0" id="gTarget">${fmt(pl.target)} <span style="font-size:16px;font-weight:600">kcal</span></div>
   <div class="kv"><span class="mut">Resting (BMR)</span><b>${fmt(pl.bmr)}</b></div><div class="kv"><span class="mut">Maintenance (TDEE)</span><b>${fmt(pl.tdee)}</b></div>

  <div class="card" style="margin-top:12px"><h2>💾 Your data</h2><div class="mut sm">Everything is stored privately in this browser (${n} log entries, ${S.foods.length} foods, ${S.recipes.length} recipes, ${weightDates().length} weigh-ins, ${Object.values(S.ex).reduce((a,l)=>a+l.length,0)} workouts). Phone and computer keep separate copies — use Export / Import to move or back up.</div>
   <div style="display:flex;gap:8px;margin-top:10px"><button class="btn g" style="flex:1" onclick="exportData()">Export backup</button><label class="btn g" style="flex:1;text-align:center;cursor:pointer">Import backup<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label></div>
   <button class="btn d w" style="margin-top:10px" onclick="if(confirm('Erase ALL data in this browser? Export a backup first if unsure.')&&confirm('Really erase everything?')){localStorage.removeItem(KEY);location.reload()}">Erase all data</button></div>
  <div class="card"><h2>📱 Install on your phone</h2><div class="sm mut">iPhone: open this page in Safari → Share → <b>Add to Home Screen</b>. It then opens full-screen like an app.</div></div>
  <div class="card"><h2>ℹ️ About</h2><div class="sm mut">${DB.length} built-in foods. General foods use typical values per 100 g/ml from nutrition tables — good for estimating. McDonald's items use McDonald's Australia's official nutrition guides (Oct 2025 – Jul 2026 editions); limited-time items are marked. Exercise calories use standard MET values from the Compendium of Physical Activities × your weight × time, counting only calories above resting (like the “active calories” on a watch). Packaged products vary, so for things you eat often, create your own food from the label. The calorie target uses the Mifflin-St Jeor equation; 1 kg of body fat ≈ 7,700 kcal.</div></div>`}
function exportData(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`calorie-tracker-backup-${dk()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.log||!d.profile)throw 0;if(!confirm('Replace the data in this browser with this backup?'))return;localStorage.setItem(KEY,JSON.stringify(d));location.reload()}catch(e){alert('That file is not a calorie tracker backup.')}};r.readAsText(f)}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(SH||EX))closeSheet()});
route();
</script>
